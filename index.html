<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смоленский Покер</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0b211b;
        }

        body {
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        /* Делаем высоту страницы равной пропорциям исходной картинки.
           Поэтому кнопки всегда находятся точно на своих местах. */
        .home {
            position: relative;
            width: 100%;
            aspect-ratio: 736 / 1308;
            background-image: url("images/home.png");
            background-position: top center;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        /* =====================================================
           КНОПКА «ВОЙТИ»
           Реальная HTML-ссылка, не JavaScript.
           Координаты соответствуют кнопке на home.png.
           ===================================================== */
        .login-link {
            position: absolute;
            left: 73.5%;
            top: 4.1%;
            width: 22%;
            height: 5.0%;
            display: block;
            z-index: 1000;
            cursor: pointer;
            text-decoration: none;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 999px;
            transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
        }

        .login-link:hover {
            background: rgba(238, 232, 217, 0.10);
            border-color: rgba(238, 232, 217, 0.55);
            box-shadow: 0 0 0 3px rgba(238, 232, 217, 0.08), 0 8px 25px rgba(0,0,0,.20);
        }

        .login-link:active {
            background: rgba(238, 232, 217, 0.18);
            transform: scale(.985);
        }

        /* Нижние кнопки пока оставляем как зоны для будущих экранов. */
        .menu-link {
            position: absolute;
            z-index: 900;
            display: block;
            cursor: pointer;
            text-decoration: none;
            color: transparent;
            background: transparent;
            border: 2px solid transparent;
            transition: background .15s ease, border-color .15s ease;
        }

        #ratingButton {
            left: 8.5%;
            top: 57.2%;
            width: 26%;
            height: 14.5%;
        }

        #profileButton {
            left: 37%;
            top: 57.2%;
            width: 26%;
            height: 14.5%;
        }

        #avatarButton {
            left: 65.5%;
            top: 57.2%;
            width: 26%;
            height: 14.5%;
        }

        #settingsButton {
            left: 8.5%;
            top: 74.0%;
            width: 26%;
            height: 14.5%;
        }

        #rulesButton {
            left: 37%;
            top: 74.0%;
            width: 26%;
            height: 14.5%;
        }

        #newsButton {
            left: 65.5%;
            top: 74.0%;
            width: 26%;
            height: 14.5%;
        }

        .menu-link:hover {
            background: rgba(238, 232, 217, 0.06);
            border-color: rgba(238, 232, 217, 0.20);
            border-radius: 22px;
        }
    </style>
</head>

<body>
    <main class="home">
        <a class="login-link" href="login.html" aria-label="Войти"></a>

        <a class="menu-link" id="ratingButton" href="#" aria-label="Рейтинг"></a>
        <a class="menu-link" id="profileButton" href="#" aria-label="Профиль"></a>
        <a class="menu-link" id="avatarButton" href="#" aria-label="Аватар"></a>
        <a class="menu-link" id="settingsButton" href="#" aria-label="Настройки"></a>
        <a class="menu-link" id="rulesButton" href="#" aria-label="Правила"></a>
        <a class="menu-link" id="newsButton" href="#" aria-label="Новости"></a>
    </main>
</body>
</html>
