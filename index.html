<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смоленский Покер</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0b211b;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .home {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("images/home.png");
            background-position: top center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Настоящая ссылка вместо невидимой кнопки */
        .login-link {
            position: absolute;
            left: 9%;
            top: 45.5%;
            width: 82%;
            height: 9%;
            display: block;
            z-index: 99999;
            cursor: pointer;
            text-decoration: none;
            color: transparent;
            background: transparent;
        }

        .login-link:hover {
            background: rgba(255,255,255,0.06);
            border-radius: 28px;
        }

        .menu-link {
            position: absolute;
            z-index: 99999;
            width: 25%;
            height: 15%;
            display: block;
            cursor: pointer;
            text-decoration: none;
            color: transparent;
            background: transparent;
        }

        #ratingButton { left: 9%; top: 56.5%; }
        #profileButton { left: 37.5%; top: 56.5%; }
        #avatarButton { left: 66%; top: 56.5%; }
        #settingsButton { left: 9%; top: 73.5%; }
        #rulesButton { left: 37.5%; top: 73.5%; }
        #newsButton { left: 66%; top: 73.5%; }

        .menu-link:hover {
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
        }
    </style>
</head>

<body>

    <main class="home">

        <a class="login-link" href="login.html" aria-label="Войти"></a>

        <a class="menu-link" id="ratingButton" href="#" aria-label="Рейтинг"></a>
        <a class="menu-link" id="profileButton" href="#" aria-label="Профиль"></a>
        <a class="menu-link" id="avatarButton" href="#" aria-label="Аватар"></a>
        <a class="menu-link" id="settingsButton" href="#" aria-label="Настройки"></a>
        <a class="menu-link" id="rulesButton" href="#" aria-label="Правила"></a>
        <a class="menu-link" id="newsButton" href="#" aria-label="Новости"></a>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
