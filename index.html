<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смоленский Покер</title><style>body{margin:0;background:#17352c;color:#eee7d7;font-family:Arial,sans-serif;text-align:center}main{max-width:900px;margin:auto;padding:50px 20px}button{padding:22px 60px;border-radius:18px;border:1px solid #c9b98e;background:#718269;color:white;font-size:24px;cursor:pointer}.table{display:none;position:fixed;inset:0;background:#17352c;align-items:center;justify-content:center}.table.open{display:flex}.felt{width:min(900px,90vw);height:min(500px,60vh);border:24px solid #76563b;border-radius:50%;background:#254b3b;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px #0008}.back{position:absolute;top:25px;left:25px;background:#d9ccb0;color:#17352c;font-size:16px;padding:12px 20px}</style></head><body><main><h1>СМОЛЕНСКИЙ ПОКЕР</h1><p>TEXAS HOLD’EM</p><button onclick="openTable()">ИГРАТЬ</button></main><section id="table" class="table"><button class="back" onclick="closeTable()">← НАЗАД</button><div class="felt"><h2>СТОЛ НА 6 ИГРОКОВ<br><small>БАНК 0</small></h2></div></section><script>function openTable(){document.getElementById('table').classList.add('open')}function closeTable(){document.getElementById('table').classList.remove('open')}</script></body></html>
