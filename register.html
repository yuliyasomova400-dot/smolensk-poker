<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Регистрация — Смоленский Покер</title>
    <link rel="stylesheet" href="css/login.css?v=20260819-12">
    <style>
        .register-form { display:flex; flex-direction:column; gap:18px; }
        .register-status { min-height:24px; margin:16px 0 0; text-align:center; color:#c5b38b; font-size:15px; line-height:1.4; }
        .register-status.error { color:#d9a29a; }
        .register-status.success { color:#b9cba9; }
        .register-submit { margin-top:8px; }
        .login-link-button { display:block; margin:24px auto 0; border:0; background:transparent; color:#c5b38b; font-size:17px; cursor:pointer; }
        .field-note { margin:-8px 4px 0; color:#8f958c; font-size:12px; }
    </style>
</head>
<body>
    <main class="login-page" aria-label="Страница регистрации">
        <section class="login-card">
            <header class="login-header">
                <div class="login-spade" aria-hidden="true">♠</div>
                <h1>РЕГИСТРАЦИЯ</h1>
                <p class="login-subtitle">Смоленский Покер</p>
            </header>

            <form class="register-form" id="registerForm">
                <label class="input-box" for="nickname">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="nickname" name="nickname" type="text" placeholder="Никнейм" minlength="3" maxlength="24" autocomplete="nickname" required>
                </label>

                <label class="input-box" for="email">
                    <span class="input-icon" aria-hidden="true">@</span>
                    <input id="email" name="email" type="email" placeholder="Электронная почта" autocomplete="email" required>
                </label>

                <label class="input-box" for="password">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="password" name="password" type="password" placeholder="Пароль" minlength="6" autocomplete="new-password" required>
                    <button type="button" class="password-eye" id="passwordEye" aria-label="Показать пароль">◉</button>
                </label>

                <p class="field-note">Минимум 6 символов</p>

                <button type="submit" class="login-button register-submit" id="registerSubmit">ЗАРЕГИСТРИРОВАТЬСЯ</button>
                <p class="register-status" id="registerStatus" aria-live="polite"></p>
            </form>

            <button type="button" class="login-link-button" id="loginLink">УЖЕ ЕСТЬ АККАУНТ? ВОЙТИ</button>
            <button type="button" class="back-button" id="backButton">← &nbsp; НАЗАД</button>
        </section>
    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const form = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const eye = document.getElementById('passwordEye');
        const status = document.getElementById('registerStatus');
        const submit = document.getElementById('registerSubmit');

        eye.addEventListener('click', () => {
            const show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.className = 'register-status';
            status.textContent = '';
            submit.disabled = true;
            submit.textContent = 'СОЗДАНИЕ АККАУНТА...';

            const nickname = document.getElementById('nickname').value.trim();
            const email = document.getElementById('email').value.trim();
            const passwordValue = password.value;

            const { data, error } = await supabase.auth.signUp({
                email,
                password: passwordValue,
                options: {
                    data: { nickname },
                    emailRedirectTo: window.location.origin + '/login.html'
                }
            });

            if (error) {
                status.className = 'register-status error';
                status.textContent = error.message;
                submit.disabled = false;
                submit.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
                return;
            }

            status.className = 'register-status success';
            if (data.session) {
                status.textContent = 'Аккаунт создан. Переносим на страницу входа...';
                setTimeout(() => window.location.href = 'login.html', 900);
            } else {
                status.textContent = 'Аккаунт создан. Проверьте почту и подтвердите email.';
                submit.disabled = false;
                submit.textContent = 'ГОТОВО';
            }
        });

        document.getElementById('loginLink').addEventListener('click', () => {
            window.location.href = 'login.html';
        });

        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
