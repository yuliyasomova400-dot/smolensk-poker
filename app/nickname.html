<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Выбор никнейма — Смоленский Покер</title><link rel="stylesheet" href="css/login.css"><style>.step{color:#c5b38b;text-align:center;margin:-20px 0 28px}.login-status{min-height:24px;margin:14px 0 0;text-align:center;color:#d9a29a}.login-status.success{color:#b9cba9}</style></head>
<body><main class="login-page"><section class="login-card"><header class="login-header"><div class="login-spade">♠</div><h1>ВАШ НИК</h1><p class="login-subtitle">Смоленский Покер</p></header><p class="step">Шаг 2 из 2 · Под этим именем вас увидят за столом</p><form class="login-form" id="nicknameForm"><label class="input-box"><span class="input-icon">♙</span><input id="nickname" type="text" minlength="3" maxlength="20" placeholder="Никнейм" autocomplete="nickname" required></label><button class="login-button" type="submit">СОХРАНИТЬ</button><p class="login-status" id="status"></p></form><button class="back-button" id="logout">← &nbsp; ВЫЙТИ</button></section></main>
<script type="module">import{currentUser,setNickname,logout}from'./js/test-db.js';if(!currentUser())location.replace('login.html');const status=document.getElementById('status');document.getElementById('nicknameForm').onsubmit=e=>{e.preventDefault();try{setNickname(document.getElementById('nickname').value);status.className='login-status success';status.textContent='Никнейм сохранён.';setTimeout(()=>location.href='cabinet.html',300)}catch(error){status.className='login-status';status.textContent=error.message}};document.getElementById('logout').onclick=()=>{logout();location.href='login.html'};</script></body></html>
