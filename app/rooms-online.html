<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Онлайн-комнаты — Смоленский Покер</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#f3ead6;background:radial-gradient(circle at 50% 30%,#174a32,#041b13 68%)}button,input,select{font:inherit}.page{width:min(1050px,94vw);margin:auto;padding:22px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back,.gold,.join{border:1px solid #b49b5e;border-radius:13px;background:#0a3524;color:#f5e3ad;cursor:pointer}.back{width:48px;height:44px;font-size:23px}.brand{text-align:center}.brand h1{margin:0;color:#e7d297;font:30px Georgia,serif;letter-spacing:2px}.brand p{margin:5px 0;color:#9fac96}.online{color:#87d99e;font-size:12px}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{border:1px solid #806f48;border-radius:20px;background:#08291def;box-shadow:0 18px 45px #0007;padding:20px}.panel h2{margin:0 0 16px;color:#e6d39d;font:21px Georgia,serif}.form{display:grid;gap:12px}.field label{display:block;margin-bottom:5px;color:#b9ad8c;font-size:12px}.field input,.field select{width:100%;height:44px;border:1px solid #726846;border-radius:10px;background:#041b13;color:#f0e7d4;padding:0 12px}.gold{height:48px;background:linear-gradient(#876d31,#59431e);font-weight:bold}.rooms{display:grid;gap:10px}.room{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px;border:1px solid #5f6549;border-radius:13px;background:#0a3022}.room h3{margin:0;color:#f1dda3;font-size:16px}.meta{margin-top:6px;color:#aab5a9;font-size:12px}.join{min-width:110px;padding:8px 12px}.empty,.status{padding:18px;text-align:center;color:#9aaa9f}.code{color:#ffe29a;letter-spacing:2px}.error{color:#e2a49b}@media(max-width:700px){.page{width:100%;padding:12px}.brand h1{font-size:20px}.brand p{font-size:10px}.layout{grid-template-columns:1fr}.panel{padding:14px;border-radius:15px}.room{grid-template-columns:1fr}.join{height:46px}.rooms{padding-bottom:20px}}
</style></head><body><main class="page"><header class="top"><button class="back" id="back">←</button><div class="brand"><h1>СМОЛЕНСКИЙ ПОКЕР</h1><p>ОБЩИЕ ОНЛАЙН-КОМНАТЫ</p><span class="online" id="connection">● ПОДКЛЮЧЕНИЕ…</span></div><div style="width:48px"></div></header><div class="layout"><section class="panel"><h2>Создать стол</h2><form class="form" id="createForm"><div class="field"><label>НАЗВАНИЕ</label><input id="roomName" maxlength="40" value="Смоленский стол"></div><div class="field"><label>БЛАЙНДЫ</label><select id="blinds"><option>25/50</option><option selected>50/100</option><option>100/200</option></select></div><div class="field"><label>СТАРТОВЫЙ СТЕК</label><select id="stack"><option>5000</option><option selected>10000</option><option>20000</option><option>50000</option></select></div><button class="gold" id="createBtn">СОЗДАТЬ КОМНАТУ</button><div class="status" id="message"></div></form></section><section class="panel"><h2>Доступные столы</h2><div class="rooms" id="rooms"><div class="empty">Загрузка столов…</div></div></section></div></main>
<script type="module" src="js/lobby.js"></script></body></html>
