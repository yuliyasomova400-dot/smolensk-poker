function flyChips(seat,amount){const root=$('chipFlightLayer'),table=document.querySelector('.table-page'),avatar=seatEl(seat)?.querySelector('.seat-avatar,.hero-avatar');if(!root||!table||!avatar)return;const from=avatar.getBoundingClientRect(),tr=table.getBoundingClientRect();let target=seatEl(seat).querySelector('.seat-bet')?.getBoundingClientRect();if(!target)target={left:tr.left+tr.width/2,top:tr.top+tr.height/2,width:0,height:0};chipValues(amount).forEach((value,i)=>{const c=chipEl(value,true),sx=from.left+from.width/2-tr.left-14,sy=from.top+from.height/2-tr.top-14,tx=target.left+target.width/2-tr.left-14,ty=target.top+target.height/2-tr.top-14;c.style.left=sx+'px';c.style.top=sy+'px';root.append(c);c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:.9},{transform:`translate(${(tx-sx)*.55}px,${(ty-sy)*.45-18}px) rotate(${90+i*24}deg)`,opacity:1,offset:.55},{transform:`translate(${tx-sx}px,${ty-sy}px) rotate(${190+i*35}deg)`,opacity:1}],{duration:430+i*45,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).finished.then(()=>c.remove())})}

function showWinnerPanel(details,total){result.innerHTML='';const title=document.createElement('div');title.textContent=`${details.length>1?'ПОБЕДИТЕЛИ':'ПОБЕДИТЕЛЬ'}: ${details.map(x=>x.p.name).join(', ')}`;result.append(title);details.forEach(x=>{const hand=document.createElement('div');hand.className='winner-hand';const who=document.createElement('div');who.className='winner-hand-name';who.textContent=x.p.name;hand.append(who);if(x.cards?.length){const cards=document.createElement('div');cards.className='winning-cards';x.cards.forEach(c=>{const d=document.createElement('div');d.className='winning-card'+(c.red?' red':'');d.textContent=c.r+c.s;cards.append(d)});hand.append(cards)}const combo=document.createElement('div');combo.className='winning-combo';combo.textContent=x.combo;hand.append(combo);result.append(hand)});const bank=document.createElement('small');bank.textContent=`Банк ${money(total)} уходит победителю`;result.append(bank);result.classList.add('show')}
function payWinners(winners,total,text,details=[],amounts=null){handOver=true;disableControls();soundWin();const equalShare=Math.floor(total/winners.length),wonBy=p=>amounts?.get(p.seat)??equalShare;showWinnerPanel(details.length?details:winners.map(p=>({p,cards:[],combo:'Победа без вскрытия'})),total);status.classList.remove('show');const root=$('chipFlightLayer'),table=document.querySelector('.table-page'),tr=table.getBoundingClientRect(),source=$('potChipPile').getBoundingClientRect();let longest=0;winners.forEach((p,w)=>{const target=seatEl(p.seat).querySelector('.seat-avatar,.hero-avatar').getBoundingClientRect(),won=wonBy(p);chipValues(won).forEach((value,i)=>{const c=chipEl(value,true);c.classList.add('payout-chip');const sx=source.left+source.width/2-tr.left-17+((i%6)-3)*6,sy=source.top+source.height/2-tr.top-17+((i%4)-2)*4,tx=target.left+target.width/2-tr.left-17,ty=target.top+target.height/2-tr.top-17,duration=950+i*38+w*90;longest=Math.max(longest,duration);c.style.left=sx+'px';c.style.top=sy+'px';root.append(c);c.animate([{transform:'translate(0,0) scale(.9)',opacity:1},{transform:`translate(${(tx-sx)*.5}px,${(ty-sy)*.42-38}px) scale(1.18) rotate(${160+i*25}deg)`,offset:.52},{transform:`translate(${tx-sx}px,${ty-sy}px) scale(.68) rotate(${350+i*33}deg)`,opacity:.95}],{duration,easing:'cubic-bezier(.18,.72,.22,1)',fill:'forwards'}).finished.then(()=>c.remove())})});setTimeout(()=>{winners.forEach(p=>{const badge=document.createElement('div');badge.className='win-badge';badge.textContent=`+${money(wonBy(p))}`;seatEl(p.seat).append(badge);setTimeout(()=>badge.remove(),2400)});pot=0;render();setTimeout(()=>{winners.forEach(p=>p.chips+=wonBy(p));saveStacks();render();finish(text,true)},1550)},longest+180)}

function findNext(from){let s=from;for(let i=0;i<6;i++){s=next(s);if(!P[s].folded&&!P[s].allIn)return s}return 0}
function roundDone(){const live=active();if(live.length<=1)return true;return live.filter(p=>!p.allIn).every(p=>acted.has(p.seat)&&p.bet===currentBet)}
function setTurn(s){turn=s;render();if(!s){stopTurnTimer();advanceStreet();return}startTurnTimer(s);if(s===4){busy=false;updateControls();say(`Ваш ход · максимум 10 секунд · нужно добавить ${Math.max(0,currentBet-P[4].bet)}`,true)}else{busy=true;disableControls(false);say(`Ходит ${P[s].name}…`,true);setTimeout(()=>{if(turn===s&&!handOver)aiMove()},650)}}
function afterMove(s){render();if(active().length===1){award(active()[0],`${active()[0].name} забирает банк`);return}if(roundDone()){turn=0;render();setTimeout(advanceStreet,650)}else setTurn(findNext(s))}
function commit(s,type,raiseTo=0){if(handOver)return;stopTurnTimer();const p=P[s],toCall=Math.max(0,currentBet-p.bet);if(type==='fold'){soundAction('fold');p.folded=true;say(`${p.name}: фолд`)}else if(type==='check'){soundAction('check');say(`${p.name}: чек`);acted.add(s)}else if(type==='call'){post(s,toCall,'колл');acted.add(s)}else{const allInTarget=p.bet+p.chips,minimumTarget=currentBet+minRaise,target=Math.min(allInTarget,Math.max(minimumTarget,raiseTo)),oldBet=currentBet;post(s,Math.max(0,target-p.bet),target===allInTarget?'ALL-IN':'рейз до');currentBet=Math.max(currentBet,p.bet);const raiseSize=currentBet-oldBet;if(raiseSize>=minRaise)minRaise=raiseSize;acted=new Set([s])}afterMove(s)}
function aiMove(){if(handOver||turn===4)return;const p=P[turn],toCall=Math.max(0,currentBet-p.bet),r=Math.random();if(toCall&&r<.18)commit(turn,'fold');else if(r>.82&&p.chips>toCall+100)commit(turn,'raise',currentBet+100);else commit(turn,toCall?'call':'check')}
function disableControls(stopTimer=true){document.querySelectorAll('.action').forEach(b=>b.disabled=true);$('betControl').classList.remove('show');if(stopTimer)stopTurnTimer()}
function updateControls(){const p=P[4],toCall=Math.max(0,currentBet-p.bet),can=turn===4&&!p.folded&&!handOver,slider=$('betSlider'),minimumAdd=Math.min(p.chips,toCall+minRaise);$('fold').disabled=!can;$('check').disabled=!can||toCall>0;$('call').disabled=!can||toCall===0;$('call').textContent=`КОЛЛ ${money(toCall)}`;slider.min=String(Math.max(50,Math.ceil(minimumAdd/50)*50));slider.max=String(Math.max(50,p.chips));slider.step='50';let chosen=Math.min(p.chips,Math.max(+slider.min,50));slider.value=String(chosen);$('betAmount').textContent=money(chosen);$('raise').disabled=!can||p.chips<=toCall;$('raise').textContent=`СТАВКА ${money(chosen)}`;$('betControl').classList.toggle('show',can&&p.chips>toCall)}
function dealBoard(n){deck.pop();for(let i=0;i<n;i++){const c=draw();board.push(c);community.append(cardEl(c));setTimeout(()=>soundCard(),i*110)}}
function advanceStreet(){if(handOver)return;collectChips();if(street===3){disableControls();say('Ривер открыт — определяем победителя…',true);setTimeout(()=>{P.slice(1).forEach(p=>p.bet=0);currentBet=0;render();const remaining=Math.max(0,4000-(Date.now()-riverOpenedAt));setTimeout(showdown,remaining)},520);return}street++;setTimeout(()=>{P.slice(1).forEach(p=>p.bet=0);currentBet=0;minRaise=100;acted=new Set();dealBoard(street===1?3:1);if(street===3)riverOpenedAt=Date.now();render();say(streetNames[street]);setTimeout(()=>setTurn(findNext(button)),550)},500)}
function score5(cs){const vals=cs.map(c=>c.v).sort((a,b)=>b-a),counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);const groups=Object.entries(counts).map(([v,n])=>[n,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);const flush=cs.every(c=>c.s===cs[0].s);let uniq=[...new Set(vals)];if(uniq[0]===14)uniq.push(1);let highStraight=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4)highStraight=uniq[i];if(flush&&highStraight)return[8,highStraight];if(groups[0][0]===4)return[7,groups[0][1],groups[1][1]];if(groups[0][0]===3&&groups[1]?.[0]===2)return[6,groups[0][1],groups[1][1]];if(flush)return[5,...vals];if(highStraight)return[4,highStraight];if(groups[0][0]===3)return[3,groups[0][1],...groups.filter(g=>g[0]===1).map(g=>g[1])];if(groups[0][0]===2&&groups[1]?.[0]===2)return[2,Math.max(groups[0][1],groups[1][1]),Math.min(groups[0][1],groups[1][1]),groups.find(g=>g[0]===1)[1]];if(groups[0][0]===2)return[1,groups[0][1],...groups.filter(g=>g[0]===1).map(g=>g[1])];return[0,...vals]}
function best7(cs){let best=null;for(let a=0;a<7;a++)for(let b=a+1;b<7;b++){const cards=cs.filter((_,i)=>i!==a&&i!==b),score=score5(cards);if(!best||cmp(score,best.score)>0)best={score,cards}}return best}function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}const handNames=['старшая карта','пара','две пары','сет','стрит','флеш','фулл-хаус','каре','стрит-флеш'];
function showdown(){handOver=true;disableControls();showOpponentCards(true);const contenders=active(),evaluated=new Map(contenders.map(p=>[p.seat,best7([...p.hole,...board])])),levels=[...new Set(P.slice(1).map(p=>p.committed).filter(Boolean))].sort((a,b)=>a-b),amounts=new Map();let previous=0;for(const level of levels){const contributors=P.slice(1).filter(p=>p.committed>=level),sidePot=(level-previous)*contributors.length,eligible=contributors.filter(p=>!p.folded&&evaluated.has(p.seat));previous=level;if(!eligible.length)continue;eligible.sort((a,b)=>cmp(evaluated.get(b.seat).score,evaluated.get(a.seat).score));const bestScore=evaluated.get(eligible[0].seat).score,wins=eligible.filter(p=>cmp(evaluated.get(p.seat).score,bestScore)===0),share=Math.floor(sidePot/wins.length),remainder=sidePot-share*wins.length;wins.forEach((p,i)=>amounts.set(p.seat,(amounts.get(p.seat)||0)+share+(i<remainder?1:0)))}const winners=[...amounts.keys()].map(s=>P[s]),total=pot,details=winners.map(p=>{const best=evaluated.get(p.seat);return{p,cards:best.cards,combo:`${handNames[best.score[0]]} · выигрыш ${money(amounts.get(p.seat))}`}}),text=`ПОБЕДИТЕЛЬ${winners.length>1?'И':''}: ${winners.map(p=>p.name).join(', ')}\nВЫПЛАЧЕНО ${money(total)}`;payWinners(winners,total,text,details,amounts)}
function award(p,text){handOver=true;disableControls();const total=pot;collectChips();setTimeout(()=>{P.slice(1).forEach(x=>x.bet=0);currentBet=0;render();setTimeout(()=>payWinners([p],total,`ПОБЕДИТЕЛЬ: ${p.name}\nОСТАЛЬНЫЕ СБРОСИЛИ КАРТЫ · ВЫИГРЫШ ${money(total)}`),120)},520)}
function finish(text,preservePanel=false){stopTurnTimer();if(preservePanel)status.classList.remove('show');else say(text,true);if(!preservePanel)result.textContent=text;result.classList.add('show');newHand.classList.add('show');turn=0;render();clearTimeout(cardCleanupTimer);cardCleanupTimer=setTimeout(clearTableCards,1500)}
function startHand(){stopTurnTimer();clearTimeout(cardCleanupTimer);handOver=false;busy=true;riverOpenedAt=0;result.classList.remove('show');newHand.classList.remove('show');community.innerHTML='';hole.innerHTML='';board=[];pot=0;street=0;currentBet=0;const blindValues=(roomData?.blinds||'50/100').split('/').map(Number),smallBlind=blindValues[0],bigBlind=blindValues[1];minRaise=bigBlind;acted=new Set();button=next(button);localStorage.setItem('smolenskDealer',button);shuffle();P.slice(1).forEach(p=>{p.hole=[];p.bet=0;p.committed=0;p.folded=p.chips<=0;p.allIn=false;seatEl(p.seat).querySelector('.mini-hole')?.remove()});let first=next(button);for(let round=0;round<2;round++){let s=first;for(let i=0;i<6;i++){P[s].hole.push(draw());s=next(s)}}P[4].hole.forEach(c=>hole.append(cardEl(c)));showOpponentCards(false);showDealer();render();const sb=next(button),bb=next(sb);post(sb,smallBlind,'малый блайнд');post(bb,bigBlind,'большой блайнд');currentBet=bigBlind;render();setTimeout(()=>setTurn(findNext(bb)),700)}
$('betSlider').addEventListener('input',()=>{$('betAmount').textContent=money(+$('betSlider').value);$('raise').textContent=`СТАВКА ${money(+$('betSlider').value)}`});
document.querySelectorAll('[data-bet-fraction]').forEach(b=>b.onclick=()=>{const slider=$('betSlider');slider.value=String(Math.max(+slider.min,Math.min(+slider.max,Math.ceil(pot*Number(b.dataset.betFraction)/50)*50)));slider.dispatchEvent(new Event('input'))});
$('fold').addEventListener('click',()=>{if(turn===4)commit(4,'fold')});$('check').addEventListener('click',()=>{if(turn===4&&currentBet===P[4].bet)commit(4,'check')});$('call').addEventListener('click',()=>{if(turn===4)commit(4,'call')});$('raise').addEventListener('click',()=>{if(turn===4)commit(4,'raise',P[4].bet+(+$('betSlider').value))});$('allInBtn').addEventListener('click',()=>{if(turn===4)commit(4,'raise',P[4].bet+P[4].chips)});newHand.onclick=()=>startHand();$('backBtn').onclick=()=>location.href=new URLSearchParams(location.search).has('onlineRoom')?'rooms-online.html?v=online-table-open-1':'cabinet.html';
$('soundToggle').textContent=soundOn?'🔊':'🔇';$('soundToggle').addEventListener('click',e=>{e.stopPropagation();soundOn=!soundOn;localStorage.setItem('smolenskSound',soundOn?'on':'off');$('soundToggle').textContent=soundOn?'🔊':'🔇';if(soundOn){unlockAudio();tone(660,.12,'triangle',.04)}});
$('volumeSlider').value=String(Math.round(masterVolume*100));$('speedSlider').value=String(Math.round(motionSpeed*100));$('settingsToggle').addEventListener('click',e=>{e.stopPropagation();$('gameSettings').classList.toggle('show')});$('volumeSlider').addEventListener('input',e=>{masterVolume=+e.target.value/100;localStorage.setItem('smolenskVolume',masterVolume)});$('speedSlider').addEventListener('input',e=>{motionSpeed=+e.target.value/100;localStorage.setItem('smolenskMotionSpeed',motionSpeed)});
if(roomData){document.querySelector('.table-info').textContent=`${roomData.name} · ${roomData.blinds} · КОМНАТА ${roomCode}`;P[4].name=roomMember?.name||player?.nickname||'Игрок'}heroName.textContent=P[4].name;$('heroAvatar').src=(roomMember?.avatar||player?.avatar||'').startsWith('images/avatars/')?(roomMember?.avatar||player.avatar):'images/avatars/01-fortress-tower.png';startHand();
document.querySelector('.table-info').textContent='ТРЕНИРОВКА С БОТАМИ · '+document.querySelector('.table-info').textContent;
$('backBtn').onclick=()=>location.href='play.html';
}
