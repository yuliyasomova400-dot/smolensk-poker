<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Кабинет — Смоленский Покер</title><link rel="stylesheet" href="css/login.css"><style>
.profile{text-align:center;color:#eee5d2}.avatar{width:112px;height:112px;margin:0 auto 10px;padding:0;border:2px solid #9b8b68;border-radius:50%;overflow:hidden;background:#f7f3eb;cursor:pointer;box-shadow:0 10px 35px #0006;transition:.18s}.avatar img,.avatar-option img{width:100%;height:100%;object-fit:cover;display:block}.avatar:hover{transform:scale(1.04);border-color:#d1bd92}.avatar-hint{margin:0 0 20px;color:#9d947f;font-size:12px}.nickname{font-size:32px;letter-spacing:2px}.chips{margin:12px 0 34px;color:#c5b38b;font-size:20px}.cabinet-actions{display:grid;gap:14px}.secondary{background:transparent}.phone{margin-top:26px;color:#8f958c;font-size:13px}.avatar-panel{display:none;margin:0 auto 24px;padding:18px;border:1px solid #786c51;border-radius:20px;background:#071d18;box-shadow:0 18px 45px #0008}.avatar-panel.open{display:block;animation:drop .18s ease}.avatar-title{margin-bottom:14px;color:#c5b38b;font-size:14px;letter-spacing:1px}.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.avatar-option{aspect-ratio:1;padding:0;border:2px solid #6f684f;border-radius:50%;overflow:hidden;background:#f7f3eb;cursor:pointer;transition:.15s}.avatar-option:hover,.avatar-option.selected{border-color:#dec99b;transform:translateY(-2px);box-shadow:0 0 0 3px #d4ba7f33}@keyframes drop{from{opacity:0;transform:translateY(-8px)}}@media(max-width:440px){.avatar-grid{gap:6px}}
</style></head><body><main class="login-page"><section class="login-card profile"><button class="avatar" id="avatar" aria-label="Выбрать аватарку"><img id="avatarImage" alt="Ваша аватарка"></button><p class="avatar-hint">Нажмите, чтобы выбрать аватарку</p><div class="avatar-panel" id="avatarPanel"><div class="avatar-title">АВАТАРКИ СМОЛЕНСКА</div><div class="avatar-grid" id="avatarGrid"></div></div><div class="nickname" id="nickname"></div><div class="chips">Стек: <b id="chips"></b></div><div class="cabinet-actions"><button class="login-button" id="rooms" onclick="location.href='rooms-online.html'">ИГРА С ДРУЗЬЯМИ</button><button class="login-button" id="play">ТРЕНИРОВКА С БОТАМИ</button><button class="login-button secondary" id="changeNick">ИЗМЕНИТЬ НИК</button><button class="back-button" id="logout">ВЫЙТИ</button></div><div class="phone" id="phone"></div></section></main>
<script type="module">import{currentUser,setAvatar,logout}from'./js/test-db.js';let user=currentUser();if(!user)location.replace('login.html');else if(!user.nickname)location.replace('nickname.html');const fallback='images/avatars/01-fortress-tower.png';const options=[['images/avatars/01-fortress-tower.png','Крепостная башня'],['images/avatars/02-cathedral.png','Собор'],['images/avatars/03-monument.png','Памятник'],['images/avatars/04-coat-of-arms.png','Герб'],['images/avatars/05-bridge.png','Мост'],['images/avatars/06-eagle.png','Орёл'],['images/avatars/07-warrior.png','Воин'],['images/avatars/08-fortress-wall.png','Крепостная стена'],['images/avatars/09-chapel.png','Часовня'],['images/avatars/10-river-cathedral.png','Собор у реки']];const avatar=document.getElementById('avatar'),panel=document.getElementById('avatarPanel'),grid=document.getElementById('avatarGrid');function selected(){return options.some(([path])=>path===user.avatar)?user.avatar:fallback}function render(){user=currentUser();const current=selected();document.getElementById('avatarImage').src=current;document.getElementById('nickname').textContent=user.nickname;document.getElementById('chips').textContent=user.chips.toLocaleString('ru-RU');document.getElementById('phone').textContent='+'+user.phone;grid.innerHTML='';for(const[path,name]of options){const button=document.createElement('button');button.className='avatar-option'+(current===path?' selected':'');button.type='button';button.title=name;button.setAttribute('aria-label',name);button.innerHTML='<img src="'+path+'" alt="'+name+'">';button.onclick=()=>{setAvatar(path);render();setTimeout(()=>panel.classList.remove('open'),180)};grid.append(button)}}avatar.onclick=()=>panel.classList.toggle('open');render();document.getElementById('play').onclick=()=>location.href='table.html?mode=training';document.getElementById('changeNick').onclick=()=>location.href='nickname.html';document.getElementById('logout').onclick=()=>{logout();location.href='index.html'};</script></body></html>
