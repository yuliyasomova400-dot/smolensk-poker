<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти — Смоленский Покер</title>
    <link rel="stylesheet" href="css/login.css?v=20260819-8">
</head>
<body>
<main class="login-page">
    <form id="loginForm" class="interaction-layer">
        <div class="input-box input-login">
            <input type="text" id="login" autocomplete="username" aria-label="Электронная почта или телефон" placeholder="">
        </div>
        <div class="input-box input-password">
            <input type="password" id="password" autocomplete="current-password" aria-label="Пароль" placeholder="">
            <button type="button" class="password-eye" id="showPassword" aria-label="Показать пароль"></button>
        </div>
        <button type="submit" class="login-button" aria-label="Войти"></button>
    </form>

    <button type="button" class="forgot-button" id="forgotButton" aria-label="Забыли пароль?"></button>
    <button type="button" class="register-button" id="registerButton" aria-label="Зарегистрироваться"></button>
    <button type="button" class="back-button" id="backButton" aria-label="Назад"></button>
</main>
<script src="js/login.js?v=20260819-6"></script>
</body>
</html>
