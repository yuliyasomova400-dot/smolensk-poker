<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Войти — Смоленский Покер</title>
    <link rel="stylesheet" href="css/login.css?v=20260819-13">
    <style>
        .login-status { min-height:24px; margin:14px 0 0; text-align:center; color:#d9a29a; font-size:14px; line-height:1.4; }
        .login-status.success { color:#b9cba9; }
    </style>
</head>
<body>
    <main class="login-page" aria-label="Страница входа">
        <section class="login-card">
            <header class="login-header">
                <div class="login-spade" aria-hidden="true">♠</div>
                <h1>ВОЙТИ</h1>
                <p class="login-subtitle">Смоленский Покер</p>
            </header>

            <form class="login-form" id="loginForm">
                <label class="input-box" for="loginEmail">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="loginEmail" name="login" type="email" placeholder="Электронная почта" autocomplete="username" required>
                </label>

                <label class="input-box" for="loginPassword">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="loginPassword" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
                    <button type="button" class="password-eye" id="passwordEye" aria-label="Показать пароль">◉</button>
                </label>

                <button type="submit" class="login-button" id="loginSubmit">ВОЙТИ</button>
                <p class="login-status" id="loginStatus" aria-live="polite"></p>
            </form>

            <button type="button" class="forgot-button" id="forgotButton">Забыли пароль?</button>

            <div class="login-divider" aria-hidden="true"><span></span><b>или</b><span></span></div>

            <section class="social-login" aria-label="Вход через сервисы">
                <div class="social-title">ВОЙТИ ЧЕРЕЗ</div>
                <div class="social-buttons">
                    <button type="button" class="social-button" data-provider="mail"><span class="social-icon">@</span><span>Mail</span></button>
                    <button type="button" class="social-button" data-provider="vk"><span class="social-icon social-vk-icon">vk</span><span>VK</span></button>
                    <button type="button" class="social-button" data-provider="apple"><span class="social-icon social-apple-icon"></span><span>Apple</span></button>
                    <button type="button" class="social-button" data-provider="max"><span class="social-icon social-max-icon">M</span><span>MAX</span></button>
                </div>
            </section>

            <button type="button" class="register-button" id="registerButton">
                <span class="register-icon" aria-hidden="true">♙+</span>
                <span class="register-text"><span>НЕТ АККАУНТА?</span><strong>ЗАРЕГИСТРИРОВАТЬСЯ</strong></span>
            </button>

            <button type="button" class="back-button" id="backButton">← &nbsp; НАЗАД</button>
        </section>
    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const password = document.getElementById('loginPassword');
        const eye = document.getElementById('passwordEye');
        const form = document.getElementById('loginForm');
        const status = document.getElementById('loginStatus');
        const submit = document.getElementById('loginSubmit');

        eye.addEventListener('click', () => {
            const show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.className = 'login-status';
            status.textContent = '';
            submit.disabled = true;
            submit.textContent = 'ВХОД...';

            const email = document.getElementById('loginEmail').value.trim();
            const passwordValue = password.value;
            const { error } = await supabase.auth.signInWithPassword({ email, password: passwordValue });

            if (error) {
                status.textContent = 'Не удалось войти. Проверьте почту и пароль.';
                submit.disabled = false;
                submit.textContent = 'ВОЙТИ';
                return;
            }

            status.className = 'login-status success';
            status.textContent = 'Вход выполнен.';
            setTimeout(() => window.location.href = 'index.html', 500);
        });

        document.getElementById('forgotButton').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                status.textContent = 'Сначала укажите электронную почту.';
                return;
            }
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/login.html'
            });
            status.className = error ? 'login-status' : 'login-status success';
            status.textContent = error ? error.message : 'Письмо для восстановления отправлено.';
        });

        document.querySelectorAll('.social-button').forEach((button) => {
            button.addEventListener('click', () => {
                const provider = button.dataset.provider;
                if (provider === 'mail') {
                    document.getElementById('loginEmail').focus();
                    return;
                }
                status.textContent = 'Вход через ' + provider.toUpperCase() + ' подключим после настройки провайдера.';
            });
        });

        document.getElementById('registerButton').addEventListener('click', () => {
            window.location.href = 'register.html';
        });

        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
