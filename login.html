<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Войти — Смоленский Покер</title>
    <link rel="stylesheet" href="css/login.css?v=20260819-12">
</head>
<body>
    <main class="login-page" aria-label="Страница входа">
        <section class="login-card">

            <header class="login-header">
                <div class="login-spade" aria-hidden="true">♠</div>
                <h1>ВОЙТИ</h1>
                <p class="login-subtitle">Смоленский Покер</p>
            </header>

            <form class="login-form" id="loginForm">
                <label class="input-box" for="loginEmail">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="loginEmail" name="login" type="text" placeholder="Электронная почта / телефон" autocomplete="username" required>
                </label>

                <label class="input-box" for="loginPassword">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input id="loginPassword" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
                    <button type="button" class="password-eye" id="passwordEye" aria-label="Показать пароль">◉</button>
                </label>

                <button type="submit" class="login-button">ВОЙТИ</button>
            </form>

            <button type="button" class="forgot-button" id="forgotButton">Забыли пароль?</button>

            <div class="login-divider" aria-hidden="true">
                <span></span><b>или</b><span></span>
            </div>

            <section class="social-login" aria-label="Вход через сервисы">
                <div class="social-title">ВОЙТИ ЧЕРЕЗ</div>
                <div class="social-buttons">
                    <button type="button" class="social-button" data-provider="mail">
                        <span class="social-icon">@</span><span>Mail</span>
                    </button>
                    <button type="button" class="social-button" data-provider="vk">
                        <span class="social-icon social-vk-icon">vk</span><span>VK</span>
                    </button>
                    <button type="button" class="social-button" data-provider="apple">
                        <span class="social-icon social-apple-icon"></span><span>Apple</span>
                    </button>
                    <button type="button" class="social-button" data-provider="max">
                        <span class="social-icon social-max-icon">M</span><span>MAX</span>
                    </button>
                </div>
            </section>

            <button type="button" class="register-button" id="registerButton">
                <span class="register-icon" aria-hidden="true">♙+</span>
                <span class="register-text">
                    <span>НЕТ АККАУНТА?</span>
                    <strong>ЗАРЕГИСТРИРОВАТЬСЯ</strong>
                </span>
            </button>

            <button type="button" class="back-button" id="backButton">← &nbsp; НАЗАД</button>
        </section>
    </main>

    <script>
        const password = document.getElementById('loginPassword');
        const passwordEye = document.getElementById('passwordEye');

        passwordEye.addEventListener('click', () => {
            const isPassword = password.type === 'password';
            password.type = isPassword ? 'text' : 'password';
            passwordEye.setAttribute('aria-label', isPassword ? 'Скрыть пароль' : 'Показать пароль');
        });

        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventDefault();
            alert('Авторизация будет подключена следующим шагом.');
        });

        document.getElementById('forgotButton').addEventListener('click', () => {
            alert('Восстановление пароля подключим следующим шагом.');
        });

        document.querySelectorAll('.social-button').forEach((button) => {
            button.addEventListener('click', () => {
                alert('Вход через ' + button.dataset.provider.toUpperCase() + ' подключим следующим шагом.');
            });
        });

        document.getElementById('registerButton').addEventListener('click', () => {
            window.location.href = 'register.html';
        });

        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
