<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Войти — Смоленский Покер</title><link rel="stylesheet" href="css/login.css?v=20260819-16">
<style>.login-status{min-height:24px;margin:14px 0 0;text-align:center;color:#d9a29a;font-size:14px;line-height:1.4}.login-status.success{color:#b9cba9}</style>
</head><body><main class="login-page" aria-label="Страница входа"><section class="login-card">
<header class="login-header"><div class="login-spade">♠</div><h1>ВОЙТИ</h1><p class="login-subtitle">Смоленский Покер</p></header>
<form class="login-form" id="loginForm"><label class="input-box"><span class="input-icon">♙</span><input id="loginEmail" type="email" placeholder="Электронная почта" autocomplete="username" required></label><label class="input-box"><span class="input-icon">♙</span><input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password" required><button type="button" class="password-eye" id="passwordEye">◉</button></label><button type="submit" class="login-button" id="loginSubmit">ВОЙТИ</button><p class="login-status" id="loginStatus"></p></form>
<button class="forgot-button" id="forgotButton">Забыли пароль?</button><div class="login-divider"><span></span><b>или</b><span></span></div>
<section class="social-login"><div class="social-title">ВОЙТИ ЧЕРЕЗ</div><div class="social-buttons"><button class="social-button" data-provider="mail"><span class="social-icon">@</span><span>Mail</span></button><button class="social-button" data-provider="vk"><span class="social-icon social-vk-icon">vk</span><span>VK</span></button><button class="social-button" data-provider="apple"><span class="social-icon social-apple-icon"></span><span>Apple</span></button><button class="social-button" data-provider="max"><span class="social-icon social-max-icon">M</span><span>MAX</span></button></div></section>
<button class="register-button" id="registerButton"><span class="register-icon">♙+</span><span class="register-text"><span>НЕТ АККАУНТА?</span><strong>ЗАРЕГИСТРИРОВАТЬСЯ</strong></span></button><button class="back-button" id="backButton">← &nbsp; НАЗАД</button>
</section></main>
<script type="module">
import {supabase} from './js/supabase.js';
const password=document.getElementById('loginPassword'),status=document.getElementById('loginStatus'),submit=document.getElementById('loginSubmit');
document.getElementById('passwordEye').onclick=()=>{const show=password.type==='password';password.type=show?'text':'password'};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();status.className='login-status';status.textContent='';submit.disabled=true;submit.textContent='ВХОД...';const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:password.value});if(error){status.textContent='Не удалось войти. Проверьте почту и пароль.';submit.disabled=false;submit.textContent='ВОЙТИ';return}status.className='login-status success';status.textContent='Вход выполнен.';setTimeout(()=>location.href='cabinet.html',400)};
document.getElementById('forgotButton').onclick=async()=>{const email=document.getElementById('loginEmail').value.trim();if(!email){status.textContent='Сначала укажите электронную почту.';return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});status.className=error?'login-status':'login-status success';status.textContent=error?error.message:'Письмо для восстановления отправлено.'};
document.querySelectorAll('.social-button').forEach(b=>b.onclick=()=>{const p=b.dataset.provider;if(p==='mail')document.getElementById('loginEmail').focus();else status.textContent='Вход через '+p.toUpperCase()+' подключим после настройки провайдера.'});
document.getElementById('registerButton').onclick=()=>location.href='register.html';document.getElementById('backButton').onclick=()=>location.href='index.html';
</script></body></html>
